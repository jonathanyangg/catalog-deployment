<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=s1.0">
    <title>{% block title %}AI Powered Course Catalog{% endblock %}</title>
    {% load static %}
    <link rel="icon" href="{% static 'core/favicon.ico' %}" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>
<body class="bg-[#0f0f0f] flex flex-col min-h-screen overscroll-none">
    <!-- Navigation Bar -->
    <nav class="bg-[#1a1a1a] shadow-lg border-b border-[#2a2a2a] px-8">
        <ul class="h-16 flex items-center sm:space-x-2 md:space-x-6">
            <li class="flex-shrink-0">
                <a href="{% url 'index' %}" class="flex items-center text-[#ededed] hover:text-white transition-colors duration-300">
                    
                    <span class="ml-2 whitespace-nowrap">Home</span>
                </a>
            </li>
            <li class="flex-shrink-0">
                <a href="https://resources.finalsite.net/images/v1710961964/lawrencevilleorg/flb57szebukchjsesrzt/course-catalog_2024-2025.pdf" 
                   class="text-[#ededed] hover:text-white transition-colors duration-300 whitespace-nowrap">
                    Course Catalog
                </a>
            </li>
            <li class="flex-shrink-0">
                <a href="https://sentinel.lawrenceville.org/survey/greensheet" 
                   class="text-[#ededed] hover:text-white transition-colors duration-300 whitespace-nowrap">
                    Scheduling Sheet
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow py-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#1a1a1a] border-t border-[#2a2a2a] text-center py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <p class="text-[#d6d4d4] text-sm">
                Developed by Jonathan Yang '25
            </p>
        </div>
    </footer>
</body>

</html>
