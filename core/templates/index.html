{% extends 'base.html' %}

{% block content %}

<div class="flex flex-col justify-start mb-4">
    <h1 class="text-5xl font-bold text-[#ededed] mt-4 mb-2">Lawrenceville AI Powered Course Catalog</h1>
    <p class="text-[#d6d4d4] text-lg mb-8">Find courses that align with your interests</p>
    
    <form method="POST" class="w-full">
        {% csrf_token %}
        <div class="mt-6 bg-[#1a1a1a] p-6 rounded-xl shadow-xl border border-[#2a2a2a]">
            <div class="flex items-center gap-4">
                <input type="text" 
                       id="input-text" 
                       name="input_text" 
                       placeholder='Tell us your passions or career goals, like "I want to work in investment banking"' 
                       class="flex-grow p-3 bg-[#242424] text-[#ededed] border border-[#3a3a3a] rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent placeholder:text-[#6e6e6e]">
                <button type="submit" 
                        class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors duration-300">
                    Search
                </button>
            </div>
            <label for="not-student" class="mt-4 flex items-center text-[#d6d4d4]">
                <input type="checkbox" id="not-student" name="not_student" class="mr-2">
                I'm not a current student
            </label>
        </div>
    </form>
</div>

{% endblock %}
