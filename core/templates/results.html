{% extends 'base.html' %}
{% block content %}

<div class="text-[#ededed]">
    <h1 class="text-4xl font-bold mb-8">Results</h1>

    <div class="bg-[#1a1a1a] p-6 rounded-xl shadow-xl border border-[#2a2a2a] mb-8">
        <h3 class="text-xl font-semibold mb-2">Original Search Query:</h3>
        <p class="text-[#d6d4d4]">"{{ text }}"</p>
    </div>

    <h3 class="text-2xl font-semibold mb-6">Recommended Classes:</h3>
    
    <div class="space-y-6">
        {% for class in most_similar %}
        <div class="bg-[#1a1a1a] p-6 rounded-xl shadow-xl border border-[#2a2a2a]">
            <h4 class="text-xl font-semibold mb-3">{{ class.course_name }}</h4>
            <p class="text-[#d6d4d4] leading-relaxed">{{ class.description_without_course_name }}</p>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
